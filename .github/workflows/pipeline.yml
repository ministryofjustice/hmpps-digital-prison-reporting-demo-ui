name: Pipeline

# Opening or updating a pull request into main runs checks only (no DEV deploy).
# Merging to main creates vX.Y.Z, publishes the image, and deploys
# prison and probation to dev and test.
# Preprod and prod are promoted from hmpps-reporting-releases, not by this push.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # release tag + GitHub Release (enable-release-tag)
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/main' && github.sha || github.ref) }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  pipeline:
    uses: ministryofjustice/hmpps-reporting-workflows/.github/workflows/frontend_node_pipeline.yml@test/tag-based-releases
    secrets: inherit
    with:
      deploy-ref: refs/heads/main
      enable-release-tag: true
      deploy-preprod-prod: false
      deploy-dev-on-feature-branches: false
      enable-probation: true
      enable-sentry: false
      # Cypress — integration is local; acceptance hits live DEV after deploy.
      # Repo is in the hmpps-github-actions-runner group (self-hosted labels).
      enable-integration-tests: true
      integration-enable-wiremock: false
      integration-enable-start-probation: false
      integration-enable-redis: false
      integration-run-typecheck: false
      enable-acceptance-tests: true
      acceptance-runs-on: '["self-hosted","Linux","X64","hmpps-github-actions-runner"]'
      node-version: '24'
      slack-channel: 'dpr_cicd_approvals'
      primary-chart-name: hmpps-digital-prison-reporting-demo-ui
      primary-release-name: hmpps-digital-prison-reporting-demo-ui
      probation-chart-name: hmpps-probation-demo-ui
      probation-release-name: hmpps-probation-demo-ui
